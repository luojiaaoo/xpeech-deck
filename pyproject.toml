[project]
name = "xpeech-deck"
version = "0.1.0"
description = "Xpeech 多实例管理平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
xpeech-deck = "xpeech_deck.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xpeech_deck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
